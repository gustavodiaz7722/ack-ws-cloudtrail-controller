ignore:
  resource_names:
    - Channel
    - Dashboard
  field_paths:
    - CreateEventDataStoreInput.BillingMode
    - CreateEventDataStoreOutput.BillingMode
    - CreateEventDataStoreInput.KmsKeyId
    - CreateEventDataStoreOutput.KmsKeyId
    - CreateEventDataStoreInput.StartIngestion
resources:
  Trail:
    fields:
      Name:
        is_immutable: true
      Tags:
        compare:
          is_ignored: true
      CloudWatchLogsRoleARN:
        references:
          resource: Role
          service_name: iam
          path: Status.ACKResourceMetadata.ARN
      # GetTrail always echoes the fully specified key ARN back, whichever of
      # the four accepted input forms was sent, so the ARN is the only path that
      # converges. kms also manages an Alias Kind, but an Alias-targeted
      # reference would resolve to a form the read-back never matches; users who
      # want an alias keep using the concrete field.
      KMSKeyID:
        references:
          resource: Key
          service_name: kms
          path: Status.ACKResourceMetadata.ARN
      # The bare bucket name, not the ARN: CreateTrail takes a name and GetTrail
      # echoes a name back, so an ARN path would never converge.
      S3BucketName:
        references:
          resource: Bucket
          service_name: s3
          path: Spec.Name
    renames:
      operations:
        CreateTrail:
          input_fields:
            TagsList: Tags
    hooks:
      delta_pre_compare:
        code: customPreCompare(delta, a, b)
      sdk_read_one_post_set_output:
        template_path: hooks/trail/sdk_read_one_post_set_output.go.tpl
    update_operation:
      custom_method_name: customUpdateTrail
    exceptions:
      errors:
        404:
          code: TrailNotFoundException
      terminal_codes:
        - InvalidParameterCombination
        - InvalidParameterValue
        - InvalidQueryParameter
        - MissingAction
        - MissingParameter
  EventDataStore:
    fields:
      AdvancedEventSelectors:
        late_initialize: {}
      Tags:
        compare:
          is_ignored: true
    is_arn_primary_key: true
    renames:
      operations:
        GetEventDataStore:
          input_fields:
            EventDataStore: Name
        CreateEventDataStore:
          input_fields:
            TagsList: Tags
    hooks:
      delta_pre_compare:
        code: customPreCompare(delta, a, b)
      sdk_update_post_build_request:
        template_path: hooks/event_data_store/sdk_update_post_build_request.go.tpl
      sdk_update_pre_build_request:
        template_path: hooks/event_data_store/sdk_update_pre_build_request.go.tpl
      sdk_read_one_post_set_output:
        template_path: hooks/event_data_store/sdk_read_one_post_set_output.go.tpl
      sdk_read_one_post_build_request:
        template_path: hooks/event_data_store/sdk_read_one_post_build_request.go.tpl
      sdk_delete_post_build_request:
        template_path: hooks/event_data_store/sdk_delete_post_build_request.go.tpl
